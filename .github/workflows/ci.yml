name: CI-CD Pipeline

env:
  SERVICE_NAME: platform-lite   # default ✅


on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write   # required for OIDC ✅

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # - name: Log in to GitHub Container Registry
      #   run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      # 
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::684651436668:role/GitHubActionsECSRole
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Detect changed service
        id: detect
        run: |
          echo "Before commit: ${{ github.event.before }}"
          echo "Current commit: ${{ github.sha }}"

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "First commit detected — scanning entire repo"
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          SERVICE=$(echo "$FILES" | grep '^services/' | cut -d'/' -f2 | uniq | head -n 1)

          echo "Detected service: $SERVICE"

          if [ -z "$SERVICE" ]; then
            echo "SERVICE_NAME=platform-lite" >> $GITHUB_ENV
          else
            echo "SERVICE_NAME=$SERVICE" >> $GITHUB_ENV
          fi

      - name: Set default service
        run: |
          if [ -z "$SERVICE_NAME" ]; then
            echo "SERVICE_NAME=platform-lite" >> $GITHUB_ENV
          fi
    
      - name: Build Docker image
        run: docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }} ./services/${{ env.SERVICE_NAME }}

      # - name: Run basic check
      #   run: node app.js & sleep 5 && kill $!

      - name: Push Docker image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Register new task definition
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${SERVICE_NAME}-task \
            --query taskDefinition)

          echo $TASK_DEF > task-def.json

          NEW_TASK_DEF=$(cat task-def.json | jq \
            --arg IMAGE "${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ env.IMAGE_TAG }}" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].healthCheck = {
                "command": ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"],
                "interval": 30,
                "timeout": 5,
                "retries": 3,
                "startPeriod": 30
              }
            | .containerDefinitions[0].environment = [
              {
                "name": "PORT",
                "value": "4000"
              },
              {
                "name": "SERVICE_NAME",
                "value": "${SERVICE_NAME}"
              }
            ]
            ')

          echo "$NEW_TASK_DEF" > new-task-def.json

          aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster platform-lite-cluster \
            --service ${SERVICE_NAME}-service \
            --task-definition ${SERVICE_NAME}-task \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}