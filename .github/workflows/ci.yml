name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci

      - name: Build Docker image
        run: docker build -t platform-lite-app .

      # - name: Run basic check
      #   run: node app.js & sleep 5 && kill $!
