version: '3.8'

services:
  app:
    build: .
    container_name: platform-lite-app
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
          - redis
    restart: always

  redis:
      image: redis:7-alpine
      container_name: platform-lite-redis
      ports:
        - "6379:6379"
      restart: always
