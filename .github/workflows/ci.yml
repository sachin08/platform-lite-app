name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write   # required for OIDC ✅

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # - name: Log in to GitHub Container Registry
      #   run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      # 
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::684651436668:role/GitHubActionsECSRole
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Detect changed services
        id: detect
        run: |
          echo "Before commit: ${{ github.event.before }}"
          echo "Current commit: ${{ github.sha }}"

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "First commit detected — scanning entire repo"
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          SERVICES=$(echo "$FILES" | grep '^services/' | cut -d'/' -f2 | sort | uniq | tr '\n' ' ')

          echo "Detected services:"
          echo "$SERVICES"

          if [ -z "$SERVICES" ]; then
            echo "No service changes detected. Skipping deploy."
            echo "SERVICES=" >> $GITHUB_ENV
          else
            echo "SERVICES=$SERVICES" >> $GITHUB_ENV
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build, Push and Deploy Services
        run: |
          set -euo pipefail

          if [ -z "$SERVICES" ]; then
            echo "Nothing to deploy ✅"
            exit 0
          fi

          for SERVICE in $SERVICES; do
            echo "🚀 Deploying $SERVICE"

            SERVICE_PATH="./services/$SERVICE"

            if [ ! -d "$SERVICE_PATH" ]; then
              echo "⚠️ Skipping $SERVICE — directory not found"
              continue
            fi

            echo "✅ Found service directory: $SERVICE_PATH"

            # ✅ Build image
            docker build \
              -t ${{ steps.login-ecr.outputs.registry }}/$SERVICE:$IMAGE_TAG \
              ./services/$SERVICE

            # ✅ Push image
            docker push \
              ${{ steps.login-ecr.outputs.registry }}/$SERVICE:$IMAGE_TAG

            # ✅ Get task definition
            TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition ${SERVICE}-task \
              --query taskDefinition)

            echo "$TASK_DEF" > task-def.json

            # ✅ Update image
            NEW_TASK_DEF=$(cat task-def.json | jq \
              --arg IMAGE "${{ steps.login-ecr.outputs.registry }}/$SERVICE:$IMAGE_TAG" \
              --arg SERVICE "$SERVICE" \
              'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
              | .containerDefinitions[0].image = $IMAGE
              | .containerDefinitions[0].environment = [
                  {"name":"PORT","value":"4000"},
                  {"name":"SERVICE_NAME","value":$SERVICE}
                ]
              ')

            echo "$NEW_TASK_DEF" > new-task-def.json

            # ✅ Register task def
            aws ecs register-task-definition \
              --cli-input-json file://new-task-def.json

            # ✅ Update service
            aws ecs update-service \
              --cluster platform-lite-cluster \
              --service ${SERVICE}-service \
              --task-definition ${SERVICE}-task \
              --force-new-deployment \
              --region ${{ secrets.AWS_REGION }}

          done
